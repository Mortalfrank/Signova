name: Publish SIGNOVA showcase

on:
  push:
    branches: [main]
    paths:
      - 'docs/showcase/**'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: showcase-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish the showcase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate pages and local media
        run: node docs/showcase/verify.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/showcase

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
